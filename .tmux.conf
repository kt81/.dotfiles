# ===============================================
# .tmux.conf
# -----------------------------------------------
# Policy:
# - Prefer the default key bindings where possible
# - Use a powerline/Nerd font for glyphs, but not the powerline plugin
# - No pip-based tooling
# ===============================================

# =======================================
# Plugin Settings 
# =======================================

# -- Essential
# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
# basic tmux settings everyone can agree on
set -g @plugin 'tmux-plugins/tmux-sensible'

# -- Control
# standard pane key-bindings for tmux
set -g @plugin 'tmux-plugins/tmux-pain-control'
# C-h/j/k/l moves between nvim splits and tmux panes without caring which is
# which. The nvim half is the matching plugin spec in nvim/lua/plugins/editor.lua.
set -g @plugin 'christoomey/vim-tmux-navigator'
# fzf-popup session/window switcher (prefix + O). Replaces walking `prefix + s`.
set -g @plugin 'omerxx/tmux-sessionx'

# -- Indicator & Visual
# CPU/RAM figures for the status line (fills the slot kube-tmux used to hold).
set -g @plugin 'tmux-plugins/tmux-cpu'

# -- Etc.
# Tmux plugin for copying to system clipboard.
set -g @plugin 'tmux-plugins/tmux-yank'
# On WSL, route tmux-yank copies to the Windows clipboard via win32yank.
# Without it tmux-yank falls back to `clip.exe`, which mangles non-ASCII; the
# `set-clipboard on` below covers that case over OSC 52 instead.
if-shell 'command -v win32yank.exe >/dev/null 2>&1' \
  'set -g @override_copy_command "win32yank.exe -i --crlf"'

# -- Session persistence
# Save/restore window layout and panes across reboots (`wsl --shutdown` wipes
# the tmux server otherwise). tpm docs require continuum to be listed LAST.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# =======================================
# Basic Settings
# =======================================

# tmux 3.6 already defaults to tmux-256color; set explicitly so tmux-sensible
# does not downgrade it to screen-256color (which loses italics/undercurl).
set -g default-terminal "tmux-256color"
# terminal-features (3.2+) supersedes `terminal-overrides ",xterm-256color:Tc"`:
# it keys off the capability instead of a hardcoded $TERM name, so truecolor
# still works under WezTerm/Alacritty/etc.
set -as terminal-features ",*:RGB"
# CSI-u / modifyOtherKeys, so Shift-Enter, Ctrl-Enter and other modified keys
# reach the pane instead of being flattened (nvim, Claude Code). `always` sends
# them even to apps that never asked; drop to `on` if some TUI garbles input.
set -s extended-keys always
set -as terminal-features ",*:extkeys"
# Let a pane talk to the outer terminal directly: image protocols, OSC probes.
set -g allow-passthrough on
# Push copies to the outer terminal's clipboard over OSC 52. Unlike shelling
# out to clip.exe this is UTF-8 clean and keeps working over SSH.
set -g set-clipboard on

set -g mode-keys vi
set -g mouse on
# https://github.com/neovim/neovim/wiki/FAQ#esc-in-tmux-or-gnu-screen-is-delayed
set -sg escape-time 10
# Forward terminal focus in/out to the pane. tmux-sensible sets this too, so
# it is redundant only while the plugins are actually installed; TUIs that
# track focus (Claude Code, nvim's FocusGained/FocusLost) go blind without it.
set -g focus-events on
# Close a window and the higher ones slide down to fill the gap.
set -g renumber-windows on
# Killing the last window of a session lands you in another session instead of
# detaching outright. Also what tmux-sessionx wants.
set -g detach-on-destroy off

set -g mode-style fg=brightblue,bg=default,dim
set -g pane-border-style fg=black,bg=default
set -g pane-active-border-style fg=yellow,bg=default

set -g window-status-style fg=colour250,bg=colour234,underscore,none
set -g message-command-style fg=colour231,bg=colour31
set -g status-style bg=colour234,none
set -g message-style fg=colour231,bg=colour31
set -g pane-border-style fg=colour240
set -g status-right-style none
set -g status-left-style none

# =======================================
# Key bindings
# =======================================

# vim-tmux-navigator claims bare C-l, so hand the real clear-screen back to
# prefix + C-l.
bind C-l send-keys 'C-l'

# =======================================
# Plugin options
# =======================================

# pain-control
set-option -g @pane_resize "10"

# resurrect: also snapshot scrollback so a restored pane is not blank
set -g @resurrect-capture-pane-contents 'on'

# continuum: autosave every 15 min and restore when the tmux server starts
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# sessionx: zoxide mode stays off since zoxide is not installed here
set -g @sessionx-bind 'O'
set -g @sessionx-window-height '75%'
set -g @sessionx-window-width '65%'
set -g @sessionx-zoxide-mode 'off'

# cpu: trim the default "%3.1f%%" down so both figures fit one segment
set -g @cpu_percentage_format '%3.0f%%'
set -g @ram_percentage_format '%3.0f%%'

# =======================================
# Status bar settings
# =======================================

set -g status-left-length "100"
set -g status-right-length "100"

# status left
set -g status-left "#{?client_prefix,#[fg=colour16 bg=orange bold] 📛 #S #[fg=orange bg=colour234 nobold nounderscore noitalics],#[fg=colour16 bg=colour254 bold] 📛 #S #[fg=colour254 bg=colour234 nobold nounderscore noitalics]}"

# window
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour234,bg=colour234,nobold,nounderscore,noitalics]#[default] #I #W #[fg=colour234,bg=colour234,nobold,nounderscore,noitalics]"
# Format for the window names
setw -g window-status-current-format "#[fg=colour234,bg=colour31,nobold,nounderscore,noitalics]#[fg=colour231,bg=colour31,bold] #I ❯ #W #[fg=colour31,bg=colour234,nobold,nounderscore,noitalics]"

# status right
# cpu/ram + date + time + host. tmux-cpu rewrites the #{cpu_*}/#{ram_*} tokens
# when it loads, which is why `run tpm` has to stay below this.
set -g status-right "#[fg=colour236,bg=colour234]#[fg=colour250,bg=colour236] 💻#{cpu_percentage} 🧠#{ram_percentage} #[fg=colour232,bg=colour236]#[fg=colour250,bg=colour232] 📅%a %b.%d.%y 🕘%H:%M #[fg=colour236,bg=colour232,nobold,nounderscore,noitalics]#[fg=colour247,bg=colour236] #h #[fg=colour252,bg=colour236,nobold,nounderscore,noitalics]"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
